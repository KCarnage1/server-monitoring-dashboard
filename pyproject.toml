[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "server-monitor"
version = "1.0.0"
description = "A live CPU, memory, disk and network dashboard for one machine. Python collects, the browser draws."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
server-monitor = "monitor.cli:main"

[tool.setuptools]
packages = ["monitor"]

[tool.setuptools.package-data]
monitor = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
